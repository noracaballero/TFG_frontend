<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>frontend</title>
    <script src="../Controllers/InitDadesProject.js"></script>
    <script  src="../Controllers/ListProject.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../../public/bootstrap.min.css">
    <link rel="stylesheet" href="css/ListProject.css">
    <style>
        a {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body onload=" getSubjects();" >
    <nav class="navbar navbar-expand-lg my-custom-navbar" data-bs-theme="dark" id="">
        <div class="container-fluid" id="navbar">
            <a class="navbar-brand" href="#">Configuration</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link dropdown-toggle" href="Subject.html" role="button" aria-haspopup="true" aria-expanded="false">Subjects</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="select_subject" class="form-label">Select Subject</label>
                <select id="select_subject" class="form-select"></select>
            </div>
            <div class="col-md-6">
                <label for="formFile" class="form-label">Import Projects</label>
                <input class="form-control" type="file" id="formFile" accept=".xlsx">
                <button id="import_projects" type="button" class="btn btn-primary mt-2" onclick="import_p()">Import</button>
            </div>
        </div>
        <h1 class="mb-3">Teams</h1>
        <button id="openNewPageButton" type="button"  class="btn btn-primary mb-3">
            <a href="InitDadesProject.html">Add team</a>
        </button>

        <div class="table-responsive">
            <table id="table_proj" class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <td>Select</td>
                        <td>Name</td>
                        <td>Subject</td>
                    </tr>
                </thead>
                <tbody id="taula_body"></tbody>
            </table>
        </div>
        <button type="button" class="btn btn-success mt-3" onclick="configurateProject();">
            Configure
        </button>
    </div>
</body>
</html>
