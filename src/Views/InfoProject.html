<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script  src="../Controllers/InfoProject.js"></script>
    <link rel="stylesheet" href="../../public/bootstrap.min.css">
    <link rel="stylesheet" href="css/InfoProject.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body >
<script>getInfoProject();</script>

    <form class="p-4">
        <div class="form-group mb-3">
            <input type="text" id="name" class="form-control" placeholder="Project name">
        </div>
        <select class="form-select mb-3" id="subject">
            <option value="asw">asw</option>
            <option value="amep">amep</option>
        </select>
        <div class="form-group mb-3" style="display: flex">
            <input type="url" id="github_url" class="form-control" placeholder="URL Github">
            <div id="invalid-feedback-div-git" class="invalid-feedback-git" style="display: none;">Admin user not present in organization</div>
            <button  class="btn custom-button" style="background-color: #1f80a8">
                <i class="bi bi-floppy-fill" style="color: white"></i>
            </button>
        </div>
        <div class="form-group mb-3" style="display: flex">
            <input type="url" id="url_taiga" class="form-control"  placeholder="URL Taiga" aria-describedby="button-addon2">
            <div id="invalid-feedback-div" class="invalid-feedback" style="display: none;">Taiga Project is private</div>
            <button  class="btn custom-button" style="background-color: #1f80a8">
                <i class="bi bi-floppy-fill" style="color: white"></i>
            </button>
        </div>
        <div class="form-group mb-3" style="display: flex">
            <input type="url" id="url_sheets" class="form-control" placeholder="URL Sheets">
            <button  class="btn custom-button" style="background-color: #1f80a8">
                <i class="bi bi-floppy-fill" style="color: white"></i>
            </button>
        </div>

        <button id="save-project" type="button"  class="btn custom-button">
            <span id="inside_button">Save Project</span>
        </button>
        <table class="table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Github Username</th>
                <th>Taiga Username</th>
                <th>Sheets Username</th>
            </tr>
            </thead>
            <tbody id="table_body">

            </tbody>
        </table>
    </form>

</body>
</html>
