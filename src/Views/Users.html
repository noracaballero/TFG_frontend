<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../Controllers/Users.js"></script>
  <link rel="stylesheet" href="../../public/bootstrap.min.css">
  <title>Users Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff; /* Cambiado a blanco */
      display: flex;
      justify-content: center;

      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #fff;
      padding: 20px;
      margin-top: 20px; /* Añadido margen superior */
    }
    table {
      width: 100%;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #639BC1;
      color: white;
    }

    a {
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body onload="setUp();getUsers(); finish();">
<div class="container">
  <input type="hidden" id="info">
  <h2>Users</h2>
  <table>
    <thead>
    <tr>
      <th>Username</th>
      <th>Password</th>
    </tr>
    </thead>
    <tbody id="table_body">
    </tbody>
  </table>
  <button type="button" class="btn btn-success mt-3" onclick="closeWindow();">Finish</button>
</div>
</body>
</html>
